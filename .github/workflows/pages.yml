name: Deploy to GitHub Pages

# This repo is a fork of player529/Jannitschar kept for web hosting:
# the game source is the repo root. Every push builds dist/ (game +
# web/ Supabase transport overlay) and publishes it to GitHub Pages,
# which serves it at xiondigital.net/voxelrage/ — the same pattern as
# XiONDiGiTaL/leapbuddies and XiONDiGiTaL/kankakombat.
# Sync the fork with upstream (GitHub's "Sync fork" button) to pull in
# new game versions; the push from the sync retriggers this deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
