name: Deploy to GitHub Pages

# This repo is a fork of player529/Jannitschar kept for web hosting:
# the game source is the repo root. Every push builds dist/ with
# web/build.mjs (pure Node, no dependencies) and publishes it to
# GitHub Pages, which serves it at xiondigital.net/voxelrage/ — the
# same pattern as XiONDiGiTaL/leapbuddies and XiONDiGiTaL/kankakombat.
# Sync the fork with upstream (GitHub's "Sync fork" button) to pull in
# new game versions; the push from the sync retriggers this deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node web/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
